<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Pet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>My Virtual Pet</h1>
    <p>HP: <span id="hp">80</span></p>
    <p>Fullness: <span id="fullness">50</span></p>
    <p>Happiness: <span id="happiness">50</span></p>

    <p id="message">I'm doing okay!</p>

    <button id="feed-button">Feed</button>
    <button id="play-button">Play</button>
    <button id="sleep-button">Sleep</button>

    <br>

    <button id="restart-button">Restart</button>

    <script src="script.js"></script>
    

</body>
</html>
